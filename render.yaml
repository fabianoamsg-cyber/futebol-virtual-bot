services:
  - type: web
    name: futebol-virtual-bot
    env: python
    buildCommand: |
      pip install -r requirements.txt
      playwright install chromium
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /usr/local/share/playwright
      - key: PORT
        value: 10000
    plan: free
